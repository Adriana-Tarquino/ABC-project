<div class="app-shell">
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="brand">
      <span class="brand-mark">ABC</span>
      <div>
        <small>Cost Intelligence</small>
        <strong>Costeo ABC</strong>
      </div>
    </div>

    <nav class="nav-section">
      <div class="nav-group" *ngFor="let group of navGroups">
        <p class="nav-label">{{ group.label }}</p>
        <a
          mat-button
          class="nav-link"
          *ngFor="let item of group.items"
          [routerLink]="item.route"
          routerLinkActive="active-link"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </div>
    </nav>

    <div class="sidebar-footer">
      <strong>Modelo ABC</strong>
      <span>Datos, asignaciones y resultados en un solo flujo operativo.</span>
    </div>
  </aside>

  <main class="main-shell">
    <header class="topbar">
      <div class="topbar-copy">
        <span>Panel empresarial</span>
        <strong>Modelo de costeo basado en actividades</strong>
      </div>

      <ng-container *ngIf="user$ | async as user">
        <div class="user-area">
          <span class="user-avatar">{{ user.email?.charAt(0)?.toUpperCase() || 'U' }}</span>
          <span class="user-email">{{ user.email }}</span>
          <button mat-icon-button (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
            <mat-icon>logout</mat-icon>
          </button>
        </div>
      </ng-container>
    </header>

    <section class="dashboard-content">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
